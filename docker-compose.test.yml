name: ticketsystem-tests

services:
  postgres-test:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ticketsystem_test
      POSTGRES_USER: ticketsystem_test
      POSTGRES_PASSWORD: local_test_only

    ports:
      - '127.0.0.1:5433:5432'

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U ticketsystem_test -d ticketsystem_test
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
