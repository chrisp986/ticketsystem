name: CI

on:
  push:
    branches: [main, dev_tickets]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ci_db_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      POSTGRES_DB: ci_db_test
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_test_only
      DATABASE_URL: postgresql://ci_user:ci_test_only@localhost:5432/ci_db_test
      TEST_DATABASE_URL: postgresql://ci_user:ci_test_only@localhost:5432/ci_db_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.5.1'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm db:test:migrate

      - name: Validate project
        run: pnpm validate
