name: CI

on:
  push:
    branches: [main, dev_tickets]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ticketsystem_ci

    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ticketsystem_test
          POSTGRES_USER: ticketsystem_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ticketsystem_test -d ticketsystem_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.5.1'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm validate

      - name: Migrate test database
        run: pnpm db:test:migrate

      - name: Run integration tests
        run: pnpm test:integration
