name: CI

on:
  push:
    branches: [main, dev_tickets]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ticketsystem_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.5.1'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm validate
